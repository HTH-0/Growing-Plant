<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOME</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
  <h1 class="site-title">홈페이지</h1>
</header>

<main class="site-main">

  <!-- 로그인 전 -->
  <div th:if="${remoteUser == null}">
    <div class="plant-card">
      <img src="/images/plant-template.png" alt="식물 템플릿" />
      <p>로그인 후 나만의 식물이 자랍니다!</p>
    </div>
  </div>

  <!-- 로그인 후 -->
  <div class="plant-wrapper" th:if="${remoteUser != null}">

    <!-- 성장 버튼 -->
    <form th:action="@{/my-plant/grow}" method="post">
      <button type="submit">성장 업데이트</button>
    </form>

    <!-- 내 식물 목록 -->
    <div class="plant-card" th:each="plant : ${myPlants}">
      <a th:href="@{/my-plant/{id}(id=${plant.id})}">
        <img th:src="@{/images/{img}(img=${plant.img})}" th:alt="${plant.name}" />
        <h3 th:text="${plant.name}">식물 이름</h3>
        <p>커밋 수: <span th:text="${plant.commitCount}">0</span></p>
        <p>성장 단계: <span th:text="${plant.growthStage}">새싹</span></p>
      </a>
    </div>

  </div>

</main>

<footer class="site-footer">
  <p>홈페이지 푸터</p>
</footer>

</body>
</html>
